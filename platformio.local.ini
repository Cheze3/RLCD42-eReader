; Personal env: Waveshare ESP32-S3-RLCD-4.2 (ST7305 400x300 reflective LCD).
; Modeled on [env:x4c]: ESP32-S3 N16R8, 1-bit SDMMC, buttons only.
;   pio run -e rlcd42 -t upload
[env:rlcd42]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_WSRLCD42=1
  ; git_branch.py only injects the version for its own env list, so set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rlcd42\"
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_RLCD42\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
